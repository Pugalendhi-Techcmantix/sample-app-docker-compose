# Development override. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Source is bind-mounted, so edits apply without rebuilding (nodemon / Vite hot reload).
services:
  api:
    build:
      context: ./backend
      target: dev
    command: ["npm", "run", "dev"]
    ports:
      - "4000:4000"
    environment:
      # backend/.env is bind-mounted too; pin the port so a local PORT there cannot leak in
      PORT: "4000"
      # the browser talks to the API directly in dev; no proxy in front
      TRUST_PROXY: "0"
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - ./backend:/app
      # keep the container's own node_modules; the host folder must not shadow them
      - /app/node_modules

  web:
    build:
      context: ./frontend
      target: dev
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_USE_POLLING: "true"
      API_PROXY_TARGET: http://api:4000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
